project:
  name: enterprise-rag-kb
  description: 企业级电池产线 RAG 知识库系统
  docs:
    - ../enterprise-rag-kb-requirements.md
    - ../enterprise-rag-kb-architecture.md
    - ../enterprise-rag-kb-api-spec.md
    - ../enterprise-rag-kb-database-schema.md
    - ../enterprise-rag-kb-ui-prototype.md
    - ../enterprise-rag-kb-mvp-task-list.md
    - ../enterprise-rag-kb-implementation-plan.md

teams:
  - id: orchestrator
    name: 主控协调 Agent
    responsibility:
      - 读取需求和架构文档
      - 创建或维护任务队列
      - 分配 agent 任务
      - 控制依赖顺序
      - 集成各 agent 结果
      - 运行最终验收
    write_scope:
      - ./
    must_not:
      - 跳过 review gate
      - 直接合并未验证任务

  - id: architect
    name: 架构守门 Agent
    responsibility:
      - 审核服务边界
      - 审核目录结构
      - 审核接口契约
      - 防止过度设计或职责混乱
    write_scope:
      - docs/
      - agent-harness/

  - id: backend_api
    name: Node API Agent
    responsibility:
      - 实现 Node.js API Gateway
      - 实现 SQLite 数据访问
      - 实现文档、搜索、问答、反馈、设置接口
      - 实现审计日志
      - 对接 Python RAG Service
    write_scope:
      - apps/api/
      - data/
    depends_on:
      - scaffold
      - database_schema

  - id: rag_engine
    name: Python RAG Agent
    responsibility:
      - 实现 FastAPI RAG 服务
      - 实现文档解析
      - 实现 chunk 切分
      - 实现 embedding
      - 实现 ChromaDB 检索
      - 实现 DeepSeek 调用
      - 实现 search debug
    write_scope:
      - services/rag/
      - data/chroma/
    depends_on:
      - scaffold

  - id: frontend
    name: Frontend UI Agent
    responsibility:
      - 实现 React 19 + TailwindCSS 前端
      - 落地 Sitor 风格主题
      - 实现 Dashboard、Chat、Documents、Debugger、Settings
      - 实现 SourcePanel 和引用交互
    write_scope:
      - apps/web/
    depends_on:
      - scaffold
      - api_contract

  - id: content
    name: Knowledge Content Agent
    responsibility:
      - 创建 14 篇初始知识文档
      - 统一 metadata
      - 优化标题层级和表格
      - 准备批量导入清单
    write_scope:
      - knowledge/
      - data/seed/
    depends_on:
      - scaffold

  - id: qa_eval
    name: QA 与 RAG 评测 Agent
    responsibility:
      - 创建验收问题集
      - 编写集成测试
      - 检查引用正确性
      - 检查无依据拒答
      - 检查安全类回答保守性
    write_scope:
      - tests/
      - evals/
      - docs/qa/
    depends_on:
      - backend_api
      - rag_engine
      - frontend

  - id: security_review
    name: 安全审查 Agent
    responsibility:
      - 审查 API Key 暴露风险
      - 审查权限过滤
      - 审查文件上传安全
      - 审查 prompt injection 防护
    write_scope:
      - docs/security/
      - tests/security/
    depends_on:
      - backend_api
      - rag_engine

execution:
  branching_strategy: worktree_or_sequential
  integration_branch: main
  review_required: true
  no_overlap_write_scope: true

