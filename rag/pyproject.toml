[project]
name = "enterprise-rag-kb-rag"
version = "1.0.0"
description = "Python RAG service for enterprise battery line knowledge base"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.3.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "openai>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
