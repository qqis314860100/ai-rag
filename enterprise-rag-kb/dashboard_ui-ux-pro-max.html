<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Line Monitor — 产线监控</title>
<style>
  /* ── Design Tokens ── */
  :root {
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
    --radius-sm: 10px; --radius-md: 16px; --radius-lg: 22px;
    --text-xs: 11px; --text-sm: 13px; --text-md: 15px; --text-lg: 20px; --text-xl: 32px; --text-2xl: 48px;
    --weight-normal: 400; --weight-medium: 510; --weight-semibold: 590; --weight-bold: 680;

    --color-surface: rgba(255,255,255,0.80);
    --color-surface-elevated: rgba(255,255,255,0.92);
    --color-bg: #f0f0f2;
    --color-text: #1c1c1e;
    --color-text-secondary: #515154;
    --color-text-tertiary: #8e8e93;
    --color-divider: rgba(0,0,0,0.08);
    --color-accent: #007AFF;
    --color-accent-soft: rgba(0,122,255,0.10);
    --color-success: #34C759;
    --color-warning: #FF9500;
    --color-danger: #FF3B30;
    --color-green-soft: rgba(52,199,89,0.12);
    --color-warning-soft: rgba(255,149,0,0.12);
    --color-danger-soft: rgba(255,59,48,0.12);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    --shadow-elevated: 0 2px 8px rgba(0,0,0,0.06), 0 16px 42px rgba(0,0,0,0.06);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", monospace;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.47059;
    letter-spacing: -0.01em;
  }

  /* Subtle radial gradient atmosphere */
  body { background: radial-gradient(ellipse at 50% 30%, rgba(210,210,220,0.5) 0%, rgba(240,240,242,0) 60%), var(--color-bg); }

  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: var(--space-xl) var(--space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
  }

  /* ── Top Bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--space-md);
  }
  .topbar-brand h1 {
    font-size: var(--text-xl);
    font-weight: var(--weight-bold);
    letter-spacing: -0.02em;
    color: var(--color-text);
  }
  .topbar-brand p {
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    margin-top: 2px;
  }
  .chip-group {
    display: inline-flex;
    background: var(--color-surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius-lg);
    padding: 3px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--color-divider);
  }
  .chip {
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    color: var(--color-text-secondary);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .chip:hover { color: var(--color-text); background: rgba(0,0,0,0.03); }
  .chip.active { background: var(--color-accent); color: #fff; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    gap: var(--space-lg);
  }

  /* ── Card ── */
  .card {
    background: var(--color-surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    box-shadow: var(--shadow-card);
    border: 1px solid var(--color-divider);
    transition: box-shadow 0.25s ease;
  }
  .card:hover { box-shadow: var(--shadow-elevated); }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-md);
  }
  .card-label {
    font-size: var(--text-xs);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-tertiary);
  }

  /* ── Left: Stations ── */
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    color: var(--color-success);
  }
  .live-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--color-success);
    box-shadow: 0 0 6px rgba(52,199,89,0.6);
    animation: livePulse 2s infinite;
  }
  @keyframes livePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.8); opacity: 0.4; }
  }
  .station-list { display: flex; flex-direction: column; gap: var(--space-xs); }
  .station-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
    cursor: default;
  }
  .station-item:hover { background: rgba(0,0,0,0.025); }
  .station-id { font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--color-text); }
  .station-name-text { font-size: var(--text-xs); color: var(--color-text-secondary); margin-left: var(--space-xs); }
  .station-badge {
    font-size: 10px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .station-badge.running { background: var(--color-green-soft); color: var(--color-success); }
  .station-badge.idle { background: var(--color-warning-soft); color: var(--color-warning); }
  .station-badge.fault { background: var(--color-danger-soft); color: var(--color-danger); animation: faultGlow 1.5s infinite; }
  @keyframes faultGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.4); }
    50% { box-shadow: 0 0 8px 2px rgba(255,59,48,0.25); }
  }

  /* ── Center: KPIs ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .kpi {
    background: var(--color-surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    box-shadow: var(--shadow-card);
    border: 1px solid var(--color-divider);
  }
  .kpi .label {
    font-size: var(--text-xs);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-tertiary);
  }
  .kpi .value {
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    letter-spacing: -0.03em;
    color: var(--color-text);
    line-height: 1;
    margin-top: var(--space-sm);
  }
  .kpi .unit { font-size: var(--text-lg); font-weight: var(--weight-normal); color: var(--color-text-secondary); margin-left: 2px; }
  .kpi .trend {
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    margin-top: var(--space-sm);
  }
  .trend.up { color: var(--color-success); }
  .trend.down { color: var(--color-danger); }

  /* Donut ring */
  .oee-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }
  .ring-card {
    background: var(--color-surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    box-shadow: var(--shadow-card);
    border: 1px solid var(--color-divider);
  }
  .ring-row { display: flex; align-items: center; gap: var(--space-lg); }
  .ring-svg { flex-shrink: 0; }
  .ring-svg circle.bg { fill: none; stroke: rgba(0,0,0,0.06); stroke-width: 7; }
  .ring-svg circle.fill { fill: none; stroke: var(--color-accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  .ring-text { position: absolute; } /* handled via JS positioning — use center div instead */
  .ring-info .ring-title { font-size: var(--text-md); font-weight: var(--weight-semibold); }
  .ring-info .ring-sub { font-size: var(--text-xs); color: var(--color-text-secondary); margin-top: 2px; }
  .ring-info .ring-detail { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: var(--space-sm); }

  .spark-card {
    background: var(--color-surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    box-shadow: var(--shadow-card);
    border: 1px solid var(--color-divider);
  }

  /* ── Right: Alerts ── */
  .alert-list { display: flex; flex-direction: column; gap: var(--space-xs); }
  .alert-item {
    display: flex; align-items: flex-start; gap: var(--space-sm);
    padding: 12px;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
    cursor: default;
  }
  .alert-item:hover { background: rgba(0,0,0,0.025); }
  .alert-marker {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .alert-marker.danger { background: var(--color-danger); }
  .alert-marker.warn { background: var(--color-warning); }
  .alert-marker.info { background: var(--color-accent); }
  .alert-body { flex: 1; min-width: 0; }
  .alert-msg { font-size: var(--text-xs); font-weight: var(--weight-medium); line-height: 1.4; }
  .alert-meta {
    font-size: 10px; color: var(--color-text-tertiary);
    margin-top: 4px;
    display: flex; gap: var(--space-md);
  }

  /* ── Sparkline ── */
  #sparkCanvas { width: 100%; height: 70px; }

  /* ── Motion ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    .live-badge::before { animation: none; }
  }

  /* ── Responsive ── */
  @media (max-width: 1100px) {
    .grid { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .kpi-row, .oee-section { grid-template-columns: 1fr; }
    .layout { padding: var(--space-md); }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <h1>产线监控</h1>
      <p>动力电池 Pack 智能制造 · 实时数据</p>
    </div>
    <div class="chip-group" id="lineSelector">
      <button class="chip active" data-line="0">Pack 总装线 A</button>
      <button class="chip" data-line="1">模组焊接线 B</button>
      <button class="chip" data-line="2">电芯分选线 C</button>
    </div>
  </header>

  <!-- Main Grid -->
  <div class="grid">

    <!-- LEFT -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">工位状态</span>
        <span class="live-badge">在线</span>
      </div>
      <div class="station-list" id="stationList"></div>
    </div>

    <!-- CENTER -->
    <div>
      <div class="kpi-row" id="kpiRow"></div>
      <div class="oee-section">
        <div class="ring-card">
          <div class="ring-row">
            <div style="position:relative;width:76px;height:76px;">
              <svg class="ring-svg" width="76" height="76" viewBox="0 0 76 76">
                <circle class="bg" cx="38" cy="38" r="31"/>
                <circle class="fill" id="oeeRing" cx="38" cy="38" r="31" stroke-dasharray="194.8" stroke-dashoffset="30"/>
              </svg>
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:680;letter-spacing:-0.02em" id="oeePct">84</div>
            </div>
            <div class="ring-info">
              <div class="ring-title">OEE 综合效率</div>
              <div class="ring-sub">可用性 × 性能 × 质量</div>
              <div class="ring-detail" id="oeeTarget">目标 ≥ 85%</div>
            </div>
          </div>
        </div>
        <div class="spark-card">
          <div class="card-label" style="margin-bottom:12px">产能趋势 · 近 8 小时</div>
          <canvas id="sparkCanvas"></canvas>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">实时告警</span>
        <span style="font-size:var(--text-xs);color:var(--color-text-tertiary)" id="alertCount">5</span>
      </div>
      <div class="alert-list" id="alertList"></div>
    </div>

  </div>
</div>

<script>
// ── Data ──
const lines = [
  { name: 'Pack 总装线 A', oeeBase: 84.2, capBase: 118, taktBase: 5.2, targetOee: 85 },
  { name: '模组焊接线 B', oeeBase: 91.7, capBase: 132, taktBase: 4.5, targetOee: 85 },
  { name: '电芯分选线 C', oeeBase: 78.3, capBase: 95,  taktBase: 6.3, targetOee: 85 },
];

const stationsAll = [
  { id:'CS-010', name:'电芯分选',   status:'running' },
  { id:'MA-020', name:'堆叠涂胶',   status:'running' },
  { id:'MW-030', name:'端板激光焊', status:'running' },
  { id:'MW-040', name:'Busbar 焊接',status:'fault' },
  { id:'MT-050', name:'模组EOL测试',status:'running' },
  { id:'PA-060', name:'Pack 总装',  status:'idle' },
  { id:'PT-070', name:'PackEOL测试',status:'running' },
  { id:'WH-080', name:'成品入库',   status:'running' },
];

const alertsAll = [
  { lvl:'danger', msg:'MW-040 Busbar 焊接功率衰减 7.2%，超阈值 5%',  station:'MW-040', time:'14:32' },
  { lvl:'warn',   msg:'PA-060 节拍降至 5.8 PPM，低于目标 6.0',        station:'PA-060', time:'14:28' },
  { lvl:'info',   msg:'MT-050 第 3 通道夹具校准完成',                  station:'MT-050', time:'14:15' },
  { lvl:'warn',   msg:'CS-010 批次 B2405 电压离散度超标 12%',         station:'CS-010', time:'13:58' },
  { lvl:'info',   msg:'AGV 调度系统 v2.4.1 热更新完成',                station:'-',      time:'13:40' },
];

const statusText = { running:'运行', idle:'待机', fault:'故障' };

// ── Sparkline ──
function drawSpark(values) {
  const canvas = document.getElementById('sparkCanvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width - 48, H = 70;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  const ctx = canvas.getContext('2d');

  const min = Math.min(...values) - 4;
  const max = Math.max(...values) + 4;
  const range = max - min || 1;
  const stepX = W / (values.length - 1);

  // Fill
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(0,122,255,0.22)');
  grad.addColorStop(1, 'rgba(0,122,255,0.02)');
  ctx.beginPath();
  values.forEach((v, i) => {
    const x = i * stepX;
    const y = H - ((v - min) / range) * (H - 10) - 5;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.lineTo((values.length-1) * stepX, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // Line
  ctx.beginPath();
  values.forEach((v, i) => {
    const x = i * stepX;
    const y = H - ((v - min) / range) * (H - 10) - 5;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#007AFF';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // End dot
  const lx = (values.length-1) * stepX;
  const ly = H - ((values[values.length-1] - min) / range) * (H - 10) - 5;
  ctx.beginPath(); ctx.arc(lx, ly, 4.5, 0, Math.PI*2);
  ctx.fillStyle = '#007AFF'; ctx.fill();
  ctx.beginPath(); ctx.arc(lx, ly, 10, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,122,255,0.16)'; ctx.fill();

  // Start/end labels
  ctx.fillStyle = '#8e8e93';
  ctx.font = '10px -apple-system, "SF Pro Text", "PingFang SC", sans-serif';
  ctx.fillText(values[0], 2, 12);
  ctx.fillText(values[values.length-1], W - 22, 12);
}

// ── Render ──
let activeLine = 0;

function render(lineIdx) {
  const L = lines[lineIdx];

  // KPI
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi"><div class="label">今日产能</div><div class="value">${L.capBase}<span class="unit">Pack</span></div><div class="trend up">▲ 8 较昨日</div></div>
    <div class="kpi"><div class="label">平均节拍</div><div class="value">${L.taktBase}<span class="unit">PPM</span></div><div class="trend" style="color:var(--color-text-secondary)">瓶颈: MW-030/040</div></div>
    <div class="kpi"><div class="label">一次良率</div><div class="value">98.7<span class="unit">%</span></div><div class="trend up">▲ 0.3% 周环比</div></div>
  `;

  // OEE ring
  const oee = L.oeeBase;
  const offset = 194.8 * (1 - oee / 100);
  document.getElementById('oeeRing').setAttribute('stroke-dashoffset', offset);
  document.getElementById('oeePct').textContent = oee;
  document.getElementById('oeeTarget').textContent = oee >= L.targetOee ? '✓ 已达标' : `目标 ≥ ${L.targetOee}% · 差 ${(L.targetOee-oee).toFixed(1)}pp`;

  // Stations
  document.getElementById('stationList').innerHTML = stationsAll.map(s => `
    <div class="station-item">
      <span><span class="station-id">${s.id}</span><span class="station-name-text">${s.name}</span></span>
      <span class="station-badge ${s.status}">${statusText[s.status]}</span>
    </div>
  `).join('');

  // Alerts
  document.getElementById('alertList').innerHTML = alertsAll.map(a => `
    <div class="alert-item">
      <div class="alert-marker ${a.lvl}"></div>
      <div class="alert-body">
        <div class="alert-msg">${a.msg}</div>
        <div class="alert-meta"><span>${a.station}</span><span>${a.time}</span></div>
      </div>
    </div>
  `).join('');
  document.getElementById('alertCount').textContent = alertsAll.length;

  // Sparkline
  const base = L.capBase;
  drawSpark([base-18, base-12, base-7, base-3, base-2, base+2, base+4, base]);
}

// ── Line Switch ──
document.getElementById('lineSelector').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeLine = parseInt(chip.dataset.line);
  render(activeLine);
});

// ── Init ──
render(0);

// Live tick (subtle value drift)
setInterval(() => {
  const L = lines[activeLine];
  L.oeeBase = Math.max(62, Math.min(99, L.oeeBase + (Math.random()-0.5)*0.3));
  L.capBase = Math.max(80, Math.min(148, L.capBase + Math.round((Math.random()-0.5)*3)));
  render(activeLine);
}, 5000);
</script>
</body>
</html>
